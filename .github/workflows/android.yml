name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Optional: sign the release APK with your own key, so that its SHA-1 stays the same
      # across builds (it must match the Android OAuth client on Google Cloud). See README.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SYNCER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SYNCER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test, lint and build
        env:
          SYNCER_KEYSTORE_PASSWORD: ${{ secrets.SYNCER_KEYSTORE_PASSWORD }}
          SYNCER_KEY_ALIAS: ${{ secrets.SYNCER_KEY_ALIAS }}
          SYNCER_KEY_PASSWORD: ${{ secrets.SYNCER_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: syncer-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: app/build/reports/
